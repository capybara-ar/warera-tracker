<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Warera Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      background: #0f172a;
      color: #e5e7eb;
      font-family: Arial, sans-serif;
      margin: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    .chart-container {
      width: 90%;
      max-width: 1000px;
      margin: 40px auto;
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
    }
  </style>
</head>

<body>

<h1>📊 Warera Player Tracker</h1>

<div class="chart-container">
  <h2>💥 User Damages</h2>
  <canvas id="damageChart"></canvas>
</div>

<div class="chart-container">
  <h2>💰 User Wealth</h2>
  <canvas id="wealthChart"></canvas>
</div>

<script>
let damageChart;
let wealthChart;

async function loadData() {
  const res = await fetch("/data");
  const users = await res.json();

  const damageDatasets = [];
  const wealthDatasets = [];

  let labels = [];

  for (const user in users) {
    const u = users[user];

    labels = u.fechas;

    damageDatasets.push({
      label: user,
      data: u.damages,
      borderWidth: 2,
      tension: 0.3
    });

    wealthDatasets.push({
      label: user,
      data: u.wealth,
      borderWidth: 2,
      tension: 0.3
    });
  }

  // destruir gráficos anteriores (para refresh)
  if (damageChart) damageChart.destroy();
  if (wealthChart) wealthChart.destroy();

  damageChart = new Chart(document.getElementById("damageChart"), {
    type: "line",
    data: {
      labels: labels,
      datasets: damageDatasets
    },
    options: {
      responsive: true,
      plugins: {
        legend: { labels: { color: "#e5e7eb" } }
      },
      scales: {
        x: { ticks: { color: "#9ca3af" } },
        y: { ticks: { color: "#9ca3af" } }
      }
    }
  });

  wealthChart = new Chart(document.getElementById("wealthChart"), {
    type: "line",
    data: {
      labels: labels,
      datasets: wealthDatasets
    },
    options: {
      responsive: true,
      plugins: {
        legend: { labels: { color: "#e5e7eb" } }
      },
      scales: {
        x: { ticks: { color: "#9ca3af" } },
        y: { ticks: { color: "#9ca3af" } }
      }
    }
  });
}

// cargar al inicio
loadData();

// 🔄 refrescar cada 60 segundos
setInterval(loadData, 60000);
</script>

</body>
</html>
